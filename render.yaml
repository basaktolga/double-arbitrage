# Render Blueprint for the hosted Arb Finder (hosted/).
# Render dashboard → New → Blueprint → pick this repo. Fill in the secrets when asked.
# Docker is used so the server has a real Chromium for the Stake collector.
services:
  - type: web
    name: arb-finder
    runtime: docker
    plan: free
    dockerfilePath: ./hosted/Dockerfile
    dockerContext: ./hosted
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # --- required
      - key: APP_PASSWORD           # password for the web page
        sync: false
      - key: ODDSPAPI_KEY           # https://oddspapi.io (free key)
        sync: false
      # --- recommended
      - key: UPLOAD_KEY             # key for the phone userscript / local uploads (backup source)
        generateValue: true
      - key: NTFY_TOPIC             # long random topic name for push alerts (ntfy app)
        sync: false
      - key: BOOKMAKERS
        value: stake,pinnacle,bet365,1xbet
      - key: SPORTS                 # OddsPapi sport ids: 10 soccer, 11 basketball, 12 tennis, 17 CS
        value: "10,11,12,17"
      - key: MIN_PROFIT
        value: "1"
      # --- Stake collector (server-side browser)
      - key: STAKE_URL              # the Stake address the server may use
        value: https://stake.com
      - key: STAKE_CATEGORIES       # fewer pages = faster and lighter
        value: home,soccer,basketball,tennis,ice-hockey,esports
      - key: STAKE_COLLECT_EVERY_MIN
        value: "30"
      - key: STAKE_COLLECTOR_MAX_MB # browser memory cap; the free plan has 512 MB in total
        value: "400"
      # --- optional
      - key: ANTHROPIC_API_KEY      # enables the AI doctor
        sync: false
      - key: WINDOW_HOURS
        value: "2"
      - key: SCAN_INTERVAL_MIN
        value: "10"
